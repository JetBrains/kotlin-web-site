name: Validate Benchmark Data

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate_benchmark_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: chrisdickinson/setup-yq@latest
        with:
          yq-version: 'v4.9.5'
      - run: |
         for file in data/benchmark/leaderboard.yml data/benchmark/archive/*.yml; do
           echo "validating $file"
           jsonschema -i <(yq eval --tojson -j "$file") data/schemas/benchmark-leaderboard.json
         done
         echo "benchmark leaderboard data is valid!"
