checks:
  - type: junit
    value: tour/basics/kotlin-tour-classes/EmployeeTest.kt
  - type: not-and
    title: "Declare the Employee data class"
    checks:
      - type: error-contains
        value: "Unresolved reference 'Employee'"
      - type: source-not-matches
        value: '\bclass\s+Employee\b'
    message: "`main()` creates an `Employee(\"Mary\", 20)`, but the class isn't declared yet: write a `data class` with an immutable `name` and a mutable `salary`, like `data class Employee(val name: String, var salary: Int)`. See [Data classes](https://kotlinlang.org/docs/kotlin-tour-classes.html#data-classes)."
