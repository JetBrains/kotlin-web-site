checks:
  - type: junit
    value: tour/basics/kotlin-tour-functions/CircleAreaTest.kt
  - type: not-and
    title: "Declare the circleArea function"
    checks:
      - type: error-contains
        value: "Unresolved reference 'circleArea'"
      - type: source-not-matches
        value: '\bfun\s+circleArea\b'
    message: "This exercise starts with no code at all. Declare the `circleArea` function again but as a [single-expression](https://kotlinlang.org/docs/kotlin-tour-functions.html#single-expression-functions)."
  - type: source-matches
    title: "Rewrite circleArea"
    value: 'fun\s+circleArea\s*\([^)]*\)[^{;]*='
    message: "Rewrite the function with an [expression body](https://kotlinlang.org/docs/kotlin-tour-functions.html#single-expression-functions)."
