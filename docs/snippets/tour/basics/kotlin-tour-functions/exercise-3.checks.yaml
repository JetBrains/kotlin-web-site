checks:
  - type: junit
    value: tour/basics/kotlin-tour-functions/IntervalInSecondsTest.kt
  - type: not-and
    title: "Give hours, minutes, and seconds default values"
    checks:
      - type: error-contains
        value: "No value passed for parameter 'hours'"
      - type: source-not-matches
        value: '\bInt\s*=\s*0\b'
    message: "The validation calls the `intervalInSeconds()` function with only some of the parameters: every parameter needs a default value of `0` for validation to pass."
