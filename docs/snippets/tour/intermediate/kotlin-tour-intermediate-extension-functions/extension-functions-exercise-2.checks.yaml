checks:
  - type: junit
    value: tour/intermediate/kotlin-tour-intermediate-extension-functions/ToLowercaseStringTest.kt
  - type: not-and
    title: "Declare toLowercaseString as an extension of String"
    checks:
      - type: error-contains
        value: "Unresolved reference 'toLowercaseString'"
      - type: source-not-matches
        value: '\bfun\s+String\s*\.\s*toLowercaseString\b'
    message: "The starter truncates the declaration after `fun`, so `toLowercaseString` doesn't exist yet: write it as an extension function of `String`, like `fun String.toLowercaseString(): String = this.lowercase()`. See [Extension functions](https://kotlinlang.org/docs/kotlin-tour-intermediate-extension-functions.html#extension-functions)."
