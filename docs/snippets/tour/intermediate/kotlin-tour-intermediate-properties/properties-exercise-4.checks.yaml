checks:
  - type: junit
    value: tour/intermediate/kotlin-tour-intermediate-properties/BudgetTest.kt
  - type: not-and
    title: "Initialize remainingBudget with the observable delegate"
    checks:
      - type: error-contains
        value: "Property must be initialized or be abstract"
      - type: source-not-matches
        value: '\bby\s+observable\s*\('
    message: "`remainingBudget` is declared but never initialized: give it the observable delegate with the initial budget, like `var remainingBudget: Int by observable(totalBudget) { _, oldValue, newValue -> ... }`. See [Standard delegates](https://kotlinlang.org/docs/kotlin-tour-intermediate-properties.html#standard-delegates)."
