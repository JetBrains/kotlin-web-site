checks:
  - type: and
    title: "Use a safe cast, a default value, and takeIf"
    checks:
      - type: source-matches
        value: '\bas\?\s*User\b'
      - type: source-matches
        value: '\?:'
      - type: source-matches
        value: '\btakeIf\s*[\({]'
    message: "Follow steps 1–3: cast safely and default with `as?` and `?:`, like `(input as? Int) ?: 0`, and include only the enabled notifications with `takeIf`, like `\"done\".takeIf { ready }` is null when `ready` is false."
