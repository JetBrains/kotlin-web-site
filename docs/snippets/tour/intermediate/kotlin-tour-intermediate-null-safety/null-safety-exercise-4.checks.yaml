checks:
  - type: junit
    value: tour/intermediate/kotlin-tour-intermediate-null-safety/ValidateStockTest.kt
  - type: not-and
    title: "Return a value from validateStock"
    checks:
      - type: error-contains
        value: "Missing return statement"
      - type: source-not-matches
        value: '\breturn\b'
    message: "`validateStock` declares an `Int` return type but its body never returns one. Return early with `-1` for every invalid case and provide the valid amount at the end."
