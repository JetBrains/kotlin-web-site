checks:
  - type: junit
    value: tour/intermediate/kotlin-tour-intermediate-null-safety/GetActiveUsernamesTest.kt
  - type: not-and
    title: "Complete the mapNotNull lambda"
    checks:
      - type: error-contains
        value: "Argument type mismatch: actual type is '(User) -> Unit'"
      - type: source-not-matches
        value: '\.isActive\b'
    message: "The `mapNotNull { /* Write your code here */ }` lambda is empty, so there is nothing to return for each user: return the username of the active users and `null` otherwise, like `users.mapNotNull { user -> if (user.isActive) user.username else null }`. See [Null values and collections](https://kotlinlang.org/docs/kotlin-tour-intermediate-null-safety.html#null-values-and-collections)."
  - type: source-matches
    title: "Return the usernames with mapNotNull"
    value: '\bmapNotNull\s*[\({]'
    message: "Keep the [`mapNotNull { ... }`](https://kotlinlang.org/docs/collection-transformations.html#map) call from the starter code — it drops every `null` the lambda returns, like `ids.mapNotNull { findUser(it) }`: return the username for active users and `null` otherwise."
