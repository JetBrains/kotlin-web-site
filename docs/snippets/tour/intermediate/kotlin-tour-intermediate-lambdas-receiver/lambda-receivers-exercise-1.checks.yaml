checks:
  - type: junit
    value: tour/intermediate/kotlin-tour-intermediate-lambdas-receiver/FetchDataTest.kt
  - type: source-matches
    title: "Append the text instead of printing it"
    value: '\bappend\w*\s*\('
    message: "Add the text with the receiver's [`append()`](https://kotlinlang.org/docs/strings.html#build-and-format-strings) function instead of printing it directly: inside the lambda the `StringBuilder` is the receiver, so `append()` needs no name — like `append(\" done\")`."
