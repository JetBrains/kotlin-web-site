checks:
  - type: junit
    value: tour/intermediate/kotlin-tour-intermediate-lambdas-receiver/ButtonEventTest.kt
  - type: and
    title: "Check the event properties inside the onEvent lambda"
    checks:
      - type: source-matches
        value: 'button\s*\.\s*onEvent\s*[\({][\s\S]*\bisRightClick\b'
      - type: source-matches
        value: 'button\s*\.\s*onEvent\s*[\({][\s\S]*\bamount\b'
    message: "`button` is the receiver so you can read the `isRightClick` and `amount` properties directly in the `onEvent()` lambda."
