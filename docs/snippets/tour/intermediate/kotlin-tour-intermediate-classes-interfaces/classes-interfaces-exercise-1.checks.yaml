checks:
  - type: and
    title: "Declare turnOn and turnOff as abstract"
    checks:
      - type: source-matches
        value: '\babstract\s+fun\s+turnOn\s*\('
      - type: source-matches
        value: '\babstract\s+fun\s+turnOff\s*\('
    message: "Declare `turnOn()` and `turnOff()` as `abstract` functions in `SmartDevice`, like `abstract class Shape { abstract fun area(): Double }` leaves the implementation to each subclass."
