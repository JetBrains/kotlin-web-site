checks:
  - type: and
    title: "Update the user with apply and log with also"
    checks:
      - type: source-matches
        value: '\bapply\s*[\({]'
      - type: source-matches
        value: '\balso\s*[\({]'
    message: "Update the user with the [`apply`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/apply.html) scope function and log with [`also`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/also.html): `apply` changes its receiver and `also` observes the result, like `person.apply { age = 30 }.also { println(it.age) }`."
